name: Cennso Release

on:
  workflow_dispatch:

jobs:
  push-to-cur:
    name: "cur-release"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: v2026.10.25
          install: true
          cache: true
          experimental: true
          github_token: "${{ secrets.GOVERNANCE_GITHUB_TOKEN }}"
      - name: Login to Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ secrets.CUR_REGISTRY_DOMAIN }}
          username: ${{ secrets.CUR_REGISTRY_USERNAME }}
          password: ${{ secrets.CUR_REGISTRY_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ secrets.CUR_REGISTRY_DOMAIN }}/${{ secrets.CUR_PROJECT_NAME }}
          tags: |
            type=semver,pattern={{raw}}
          flavor: |
            latest=false
            prefix=
            suffix=
      # Same build as the container-image workflow and as a local run: one
      # `mise run image:build`, with the tags, the push and the version label
      # handed in through the environment.
      - name: Build and push
        env:
          CRI: docker
          TAGS: ${{ steps.meta.outputs.tags }}
          PLATFORMS: linux/amd64,linux/arm64
          PUSH: "true"
          VERSION: ${{ github.ref_name }}
        run: VERSION="${VERSION#v}" mise run image:build
