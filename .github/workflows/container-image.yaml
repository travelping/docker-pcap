name: Container Image

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  # The image:* tasks default to podman, which the runners do not have.
  CRI: docker

jobs:
  build:
    name: "build-test"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: v2026.10.25
          install: true
          cache: true
          experimental: true
          github_token: "${{ secrets.GOVERNANCE_GITHUB_TOKEN }}"
      # Multi-platform needs the docker-container driver; the plain docker
      # driver builds the host platform only.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The same platform set the release pushes, so nothing arch-specific
      # reaches a release unbuilt. Neither pushed nor loaded: a multi-platform
      # result cannot enter the local image store, and building it is the point.
      - name: Build all release platforms
        env:
          PLATFORMS: linux/amd64,linux/arm64
        run: mise run image:build
      # Host platform again, this time loaded, because image:test runs it.
      # Everything is cached from the step above, so this costs seconds.
      - name: Build for the smoke test
        env:
          LOAD: "true"
        run: mise run image:build
      - name: Smoke test
        run: mise run image:test
